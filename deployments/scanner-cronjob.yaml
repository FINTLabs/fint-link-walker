# Per-tenant scanner CronJobs. Each runs every 6 hours, staggered by
# 4-minute offsets so they don't all hit FLAIS / FINT API at once.
#
# Database: writes go to the fint-core Postgres schema FLAIS provisions
# for the reader (reader-deployment.yaml's Application kicks off the
# user/schema creation). Each CronJob references the same secret so
# scanner (writer) and reader (queries) share the schema.
#
# All env config comes from environment variables — see the README for
# the full list. ORG_ID / COMPONENTS are per-tenant; everything else
# defaults to in-cluster service URLs.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fint-link-walker-scanner-afk-no
  namespace: fint-core
  labels:
    app: fint-link-walker-scanner
    tenant: afk-no
    app.kubernetes.io/name: fint-link-walker-scanner
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fint-felleskomponent
    fintlabs.no/team: core
    fintlabs.no/org-id: fintlabs-no
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: fint-link-walker-scanner
        tenant: afk-no
        app.kubernetes.io/name: fint-link-walker-scanner
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: fint-felleskomponent
        fintlabs.no/team: core
        fintlabs.no/org-id: fintlabs-no
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fint-link-walker-scanner
            tenant: afk-no
            app.kubernetes.io/name: fint-link-walker-scanner
            app.kubernetes.io/component: backend
            app.kubernetes.io/part-of: fint-felleskomponent
            fintlabs.no/team: core
            fintlabs.no/org-id: fintlabs-no
        spec:
          restartPolicy: Never
          containers:
            - name: scanner
              image: ghcr.io/fintlabs/fint-link-walker-scanner:3.0.0-rc.1-go
              imagePullPolicy: IfNotPresent
              env:
                - name: ORG_ID
                  value: "afk_no"
                - name: COMPONENTS
                  value: "administrasjon-fullmakt,administrasjon-kodeverk,administrasjon-organisasjon,administrasjon-personal,felles-kodeverk,personvern-samtykke,ressurs-datautstyr,ressurs-eiendel,ressurs-tilgang,utdanning-elev,utdanning-kodeverk,utdanning-larling,utdanning-ot,utdanning-timeplan,utdanning-utdanningsprogram,utdanning-vurdering"
                # Postgres — references the secret FLAIS created for
                # the reader Application. Same schema, same DB.
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: fint-link-walker-reader
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: fint-link-walker-reader
                      key: password
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: fint-link-walker-reader
                      key: host
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: fint-link-walker-reader
                      key: port
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: fint-link-walker-reader
                      key: database
                - name: DATABASE_URL
                  value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=require"
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "12Gi"
---
