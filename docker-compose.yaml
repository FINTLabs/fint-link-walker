services:
  postgres:
    image: postgres:16-alpine
    container_name: link-walker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: linkwalker
      POSTGRES_USER: linkwalker
      POSTGRES_PASSWORD: linkwalker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwalker -d linkwalker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
