spring:
  main:
    web-application-type: none
  config:
    import: classpath:auto-relations.yaml
  datasource:
    url: ${fint.database.url}
    username: ${fint.database.username}
    password: ${fint.database.password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 500
      hibernate.order_inserts: true
      hibernate.jdbc.batch_versioned_data: true

fint:
  link-walker:
    scanner:
      base-url: "https://api.felleskomponent.no"
      # default for local dev; in k8s pass --fint.link-walker.scanner.org-id=<orgId>
      org-id: afk_no
      # Defaults to all FINT components (see ScannerProperties.ALL_FINT_COMPONENTS).
      # Override per deployment to narrow scope, e.g. only utdanning_*.
      components:
        - "administrasjon_fullmakt"
        - "administrasjon_kodeverk"
        - "administrasjon_organisasjon"
        - "administrasjon_personal"
        - "felles_kodeverk"
        - "personvern_samtykke"
        - "ressurs_datautstyr"
        - "ressurs_eiendel"
        - "ressurs_tilgang"
        - "utdanning_elev"
        - "utdanning_kodeverk"
        - "utdanning_larling"
        - "utdanning_ot"
        - "utdanning_timeplan"
        - "utdanning_utdanningsprogram"
        - "utdanning_vurdering"
    index:
      auto-relation-components:
        - "utdanning_elev"
        - "utdanning_vurdering"
        - "utdanning_utdanningsprogram"
        - "utdanning_timeplan"
        - "utdanning_kodeverk"
    http:
      max-attempts: 5
