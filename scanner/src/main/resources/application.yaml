spring:
  main:
    web-application-type: none
  config:
    import: classpath:auto-relations.yaml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linkwalker}
    username: ${SPRING_DATASOURCE_USERNAME:linkwalker}
    password: ${SPRING_DATASOURCE_PASSWORD:linkwalker}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true

link-walker:
  base-url: "https://api.felleskomponent.no"
  org-id: afk_no   # default for local dev; in k8s pass --link-walker.org-id=<orgId>
  # Defaults to all FINT components (see LinkWalkerConfig.ALL_FINT_COMPONENTS).
  # Override per deployment to narrow scope, e.g. only utdanning_*.
  components:
    - "administrasjon_fullmakt"
    - "administrasjon_kodeverk"
    - "administrasjon_organisasjon"
    - "administrasjon_personal"
    - "felles_kodeverk"
    - "personvern_samtykke"
    - "ressurs_datautstyr"
    - "ressurs_eiendel"
    - "ressurs_tilgang"
    - "utdanning_elev"
    - "utdanning_kodeverk"
    - "utdanning_larling"
    - "utdanning_ot"
    - "utdanning_timeplan"
    - "utdanning_utdanningsprogram"
    - "utdanning_vurdering"
  auto-relation-components:
    - "utdanning_elev"
    - "utdanning_vurdering"
    - "utdanning_utdanningsprogram"
    - "utdanning_timeplan"
    - "utdanning_kodeverk"
  max-attempts: 5
