spring:
  main:
    web-application-type: none
  config:
    import: classpath:auto-relations.yaml

link-walker:
  base-url: "https://api.felleskomponent.no"
  tenant: agderfk-no   # default for local dev; in k8s pass --link-walker.tenant=<tenant>
  storage:
    type: file     # local-friendly default; prod overrides to "blob" via env / ConfigMap
    file:
      directory: /tmp/link-walker-reports
    blob:
      endpoint: "https://fintlink.blob.core.windows.net"
      container: link-walker-reports
  # Defaults to all FINT components (see LinkWalkerConfig.ALL_FINT_COMPONENTS).
  # Override per deployment to narrow scope, e.g. only utdanning_*.
  components:
    - "administrasjon_fullmakt"
    - "administrasjon_kodeverk"
    - "administrasjon_organisasjon"
    - "administrasjon_personal"
    - "felles_kodeverk"
    - "personvern_samtykke"
    - "ressurs_datautstyr"
    - "ressurs_eiendel"
    - "ressurs_tilgang"
    - "utdanning_elev"
    - "utdanning_kodeverk"
    - "utdanning_larling"
    - "utdanning_ot"
    - "utdanning_timeplan"
    - "utdanning_utdanningsprogram"
    - "utdanning_vurdering"
  auto-relation-components:
    - "utdanning_elev"
    - "utdanning_vurdering"
    - "utdanning_utdanningsprogram"
    - "utdanning_timeplan"
    - "utdanning_kodeverk"
  max-attempts: 5

fint:
  linkwalker:
    auth:
      flais-gateway: "http://localhost:56417"
