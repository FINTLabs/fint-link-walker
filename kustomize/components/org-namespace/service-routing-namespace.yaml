apiVersion: batch/v1
kind: CronJob
metadata:
  name: fint-link-walker-scanner
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: scanner
              env:
                - name: FINT_LINKWALKER_SCANNER_SERVICEROUTING_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
