name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scanner: ${{ steps.filter.outputs.scanner }}
      reader: ${{ steps.filter.outputs.reader }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base="${{ github.event.before }}"
          fi
          .github/scripts/changed-modules.sh "$base" HEAD | tee -a "$GITHUB_OUTPUT"

  scanner:
    needs: changes
    if: ${{ needs.changes.outputs.scanner == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :scanner:check
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-scanner
          path: scanner/build/reports/tests/

  reader:
    needs: changes
    if: ${{ needs.changes.outputs.reader == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :reader:check
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-reader
          path: reader/build/reports/tests/

  ci-ok:
    needs: [scanner, reader]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.scanner.result }}" = "failure" ] || [ "${{ needs.reader.result }}" = "failure" ]; then
            echo "a module check failed"
            exit 1
          fi
          echo "ok"
