name: CD

on:
  push:
    branches: [main, develop]

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      images: ${{ steps.images.outputs.images }}
      image-list: ${{ steps.images.outputs.image-list }}
      targets: ${{ steps.targets.outputs.targets }}
      replica-namespaces: ${{ steps.targets.outputs.replica-namespaces }}
    steps:
      - uses: actions/checkout@v7

      - name: Map branch to environment
        id: env
        run: |
          case "$GITHUB_REF_NAME" in
            main)    echo "environment=api"  >> "$GITHUB_OUTPUT" ;;
            develop) echo "environment=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "no environment for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Resolve image tags from source content
        id: images
        run: |
          eval "$(.github/scripts/image-tags.sh)"
          echo "scanner=$scanner reader=$reader"
          images=$(jq -nc --arg s "$scanner" --arg r "$reader" \
            '[{module:"scanner", image:"ghcr.io/fintlabs/fint-link-walker-scanner:\($s)"}, {module:"reader", image:"ghcr.io/fintlabs/fint-link-walker-reader:\($r)"}]')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          {
            echo "image-list<<EOF"
            jq -r '.[].image' <<< "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Discover overlays and their namespaces
        id: targets
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          dir="kustomize/overlays/$ENVIRONMENT"
          targets='[]'
          replicas=()
          for overlay in $(find "$dir" -mindepth 1 -maxdepth 1 -type d ! -name "*.disabled" -exec basename {} \; | sort); do
            rendered=$(kubectl kustomize "$dir/$overlay")
            namespace=$(yq -N '.metadata.namespace' <<< "$rendered" | sort -u)
            if [ "$(wc -l <<< "$namespace")" -ne 1 ] || [ -z "$namespace" ] || [ "$namespace" = "null" ]; then
              echo "$overlay must render into exactly one namespace, got: $namespace"
              exit 1
            fi
            targets=$(jq -c --arg o "$overlay" --arg n "$namespace" '. + [{overlay: $o, namespace: $n}]' <<< "$targets")
            if grep -q 'replicator.v1.mittwald.de/replicate-from: fint-core/fint-link-walker-reader-db' <<< "$rendered"; then
              replicas+=("$namespace")
            fi
          done
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "replica-namespaces=$(IFS=,; echo "${replicas[*]}")" >> "$GITHUB_OUTPUT"
          echo "targets in $dir: $targets"

  build:
    name: Build ${{ matrix.module }}
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether ${{ env.IMAGE }} already exists
        id: exists
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already in registry, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.exists.outputs.exists == 'false'

      - uses: actions/setup-java@v6
        if: steps.exists.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.exists.outputs.exists == 'false'

      - name: Test ${{ matrix.module }}
        if: steps.exists.outputs.exists == 'false'
        run: ./gradlew :${{ matrix.module }}:check

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy ${{ matrix.overlay }} to ${{ needs.setup.outputs.environment }}
    needs: [setup, build]
    if: needs.setup.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.targets) }}
    environment: ${{ needs.setup.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve cluster + resource group
        id: aks
        run: |
          case "$ENVIRONMENT" in
            beta) echo "cluster=aks-beta-fint-2021-11-23" >> "$GITHUB_OUTPUT" ;;
            api)  echo "cluster=aks-api-fint-2022-02-08"  >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          echo "resource-group=rg-aks-$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Bake manifests with Kustomize
        id: bake
        uses: azure/k8s-bake@v4.0.0
        with:
          renderEngine: "kustomize"
          kustomizationPath: "kustomize/overlays/${{ env.ENVIRONMENT }}/${{ matrix.overlay }}"

      - name: Substitute images into baked YAML
        id: substitute
        uses: azure/k8s-artifact-substitute@v2.0.0
        with:
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: ${{ needs.setup.outputs.image-list }}

      - uses: azure/login@v3.0.0
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', needs.setup.outputs.environment)] }}"

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: "v0.0.26"

      - name: Set the target cluster
        uses: azure/aks-set-context@v5.0.0
        with:
          cluster-name: "${{ steps.aks.outputs.cluster }}"
          resource-group: "${{ steps.aks.outputs.resource-group }}"
          admin: "true"
          use-kubelogin: "true"

      - name: Deploy
        uses: azure/k8s-deploy@v6.0.0
        with:
          action: deploy
          manifests: ${{ steps.substitute.outputs.manifests }}
          images: ${{ needs.setup.outputs.image-list }}
          pull-images: false
          namespace: ${{ matrix.namespace }}

      - name: Let scanners in other namespaces replicate the reader's DB secret
        if: matrix.overlay == 'reader' && needs.setup.outputs.replica-namespaces != ''
        env:
          NAMESPACES: ${{ needs.setup.outputs.replica-namespaces }}
        run: |
          kubectl -n fint-core wait --for=create secret/fint-link-walker-reader-db --timeout=5m
          kubectl -n fint-core annotate secret fint-link-walker-reader-db --overwrite \
            replicator.v1.mittwald.de/replication-allowed=true \
            replicator.v1.mittwald.de/replication-allowed-namespaces="$NAMESPACES"
